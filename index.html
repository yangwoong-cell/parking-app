<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/encoding/0.2.4/encoding.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=Bebas+Neue&display=swap');

  :root {
    --primary: #FF6600;
    --primary-dark: #CC5200;
    --bg: #0A0A0F;
    --bg2: #12121A;
    --bg3: #1C1C28;
    --card: #1E1E2E;
    --border: #2A2A3E;
    --text: #F0F0F8;
    --text2: #8888AA;
    --text3: #5555770;
    --success: #00CC88;
    --danger: #FF4455;
    --warning: #FFCC00;
    --info: #4499FF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  #root { min-height: 100vh; }


  /* SWIPE DELETE */
  .swipe-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    margin-bottom: 0;
  }
  .swipe-card {
    position: relative;
    z-index: 1;
    transition: transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
    touch-action: pan-y;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    will-change: transform;
  }
  .swipe-delete-bg {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 90px;
    background: var(--danger);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    z-index: 0;
  }
  .swipe-delete-bg span {
    color: white;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }


  /* CALENDAR */
  .cal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:300; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn 0.2s; }
  .cal-box { background:var(--bg2); border-radius:24px 24px 0 0; border:1px solid var(--border); width:100%; max-width:430px; padding:20px 16px 36px; animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-nav { width:36px; height:36px; border:1px solid var(--border); border-radius:10px; background:var(--bg3); color:var(--text); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cal-title { font-size:16px; font-weight:700; color:var(--text); }
  .cal-weekdays { display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .cal-weekday { text-align:center; font-size:11px; font-weight:700; color:var(--text2); padding:4px 0; }
  .cal-weekday.sun, .cal-weekday.sat { color:var(--danger); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-day { position:relative; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; cursor:pointer; font-size:14px; font-weight:500; color:var(--text); }
  .cal-day:active { opacity:0.7; }
  .cal-day.empty { cursor:default; }
  .cal-day.holiday { color:var(--danger) !important; }
  .cal-day.sat { color:#6699FF; }
  .cal-day.today { background:var(--bg3); border:1px solid var(--primary); font-weight:700; }
  .cal-day.selected { background:var(--primary); color:white !important; }
  .cal-dot { width:5px; height:5px; border-radius:50%; background:var(--primary); position:absolute; bottom:3px; }
  .cal-day.selected .cal-dot { background:white; }
  /* STATS BAR TODAY */
  .today-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 16px 12px; }
  .today-stat { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:10px 8px; text-align:center; }
  .today-stat-val { font-size:22px; font-weight:900; color:var(--primary); }
  .today-stat-lbl { font-size:10px; color:var(--text2); margin-top:2px; }


  /* BLACK LIST */
  .bl-table { width:100%; border-collapse:collapse; }
  .bl-table th {
    background:var(--bg3); color:var(--text2); font-size:11px; font-weight:700;
    padding:8px 10px; text-align:center; border-bottom:1px solid var(--border);
    letter-spacing:0.5px;
  }
  .bl-table th:first-child { text-align:left; border-radius:10px 0 0 0; }
  .bl-table th:last-child  { border-radius:0 10px 0 0; }
  .bl-table td {
    padding:11px 10px; text-align:center; border-bottom:1px solid var(--border);
    font-size:13px; color:var(--text); vertical-align:middle;
  }
  .bl-table td:first-child { text-align:left; }
  .bl-table tr:last-child td { border-bottom:none; }
  .bl-table tr:active td { background:rgba(255,255,255,0.03); }
  .bl-rank {
    width:22px; height:22px; border-radius:50%; display:inline-flex;
    align-items:center; justify-content:center; font-size:11px; font-weight:900;
    margin-right:4px;
  }
  .bl-rank.r1 { background:#FFD700; color:#000; }
  .bl-rank.r2 { background:#C0C0C0; color:#000; }
  .bl-rank.r3 { background:#CD7F32; color:#fff; }
  .bl-rank.rn { background:var(--bg3); color:var(--text2); }
  .bl-plate-btn {
    font-family:'Bebas Neue',monospace; font-size:17px; letter-spacing:2px;
    color:var(--primary); background:none; border:none; cursor:pointer; padding:0;
    text-decoration:underline; text-underline-offset:3px;
  }
  .bl-enf  { font-weight:700; color:var(--warning); }
  .bl-stk  { font-weight:900; color:var(--danger); }
  .bl-zero { color:var(--border); font-weight:400; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* SCREEN */
  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* HEADER */
  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .header-sub {
    font-size: 11px;
    color: var(--text2);
    margin-top: 1px;
  }

  .back-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    color: var(--text);
    font-size: 18px;
    flex-shrink: 0;
  }

  /* MAIN SCREEN */
  .main-logo {
    padding: 28px 20px 20px;
    text-align: center;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--primary) 0%, #FF8833 100%);
    padding: 8px 18px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: white;
    margin-bottom: 12px;
  }

  .main-title {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--text);
    line-height: 1.2;
    letter-spacing: -1px;
  }

  .main-title span { color: var(--primary); }

  .main-subtitle {
    font-size: 13px;
    color: var(--text2);
    margin-top: 6px;
  }

  /* MENU GRID */
  .menu-grid {
    padding: 0 16px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .menu-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .menu-card:active { transform: scale(0.97); }

  .menu-card.primary-card {
    grid-column: span 2;
    background: linear-gradient(135deg, var(--primary) 0%, #FF8833 100%);
    border: none;
  }

  .menu-card.primary-card .menu-icon { background: rgba(255,255,255,0.2); }
  .menu-card.primary-card .menu-label { color: white; }
  .menu-card.primary-card .menu-desc { color: rgba(255,255,255,0.75); }

  .menu-icon {
    width: 46px;
    height: 46px;
    background: var(--bg3);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 14px;
  }

  .menu-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .menu-desc {
    font-size: 11px;
    color: var(--text2);
    line-height: 1.5;
  }

  .menu-card::after {
    content: '›';
    position: absolute;
    right: 18px;
    top: 22px;
    font-size: 20px;
    color: var(--text2);
  }

  .menu-card.primary-card::after { color: rgba(255,255,255,0.6); }

  /* STATS BAR */
  .stats-bar {
    margin: 0 16px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .stat-item { text-align: center; }
  .stat-val {
    font-size: 22px;
    font-weight: 900;
    color: var(--primary);
  }
  .stat-lbl {
    font-size: 10px;
    color: var(--text2);
    margin-top: 2px;
  }

  /* CAMERA SCREEN */
  .camera-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
    gap: 16px;
  }

  .camera-viewfinder {
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 20px;
    border: 2px solid var(--border);
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .camera-viewfinder video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .camera-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
  }

  .scan-frame {
    width: 75%;
    height: 22%;
    border: 2px solid var(--primary);
    border-radius: 8px;
    position: relative;
    animation: scanPulse 2s ease-in-out infinite;
  }

  @keyframes scanPulse {
    0%, 100% { border-color: var(--primary); box-shadow: 0 0 0 0 rgba(255,102,0,0.4); }
    50% { border-color: #FF8833; box-shadow: 0 0 0 8px rgba(255,102,0,0); }
  }

  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    animation: scanLine 2s linear infinite;
  }

  @keyframes scanLine {
    0% { top: 0%; }
    100% { top: 100%; }
  }

  .camera-hint {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.5);
    padding: 6px 14px;
    border-radius: 20px;
  }

  .plate-display {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .plate-lbl { font-size: 11px; color: var(--text2); margin-bottom: 4px; }

  .plate-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--text);
    letter-spacing: 3px;
  }

  .plate-number.detected { color: var(--primary); }

  .plate-edit {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }

  /* BUTTONS */
  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary) 0%, #FF8833 100%);
    color: white;
  }

  .btn-secondary {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-success {
    background: linear-gradient(135deg, var(--success) 0%, #00AA77 100%);
    color: white;
  }

  .btn-danger {
    background: linear-gradient(135deg, var(--danger) 0%, #CC3344 100%);
    color: white;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* FORMS */
  .form-wrap { padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; }

  .form-group { display: flex; flex-direction: column; gap: 6px; }

  .form-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: 0.3px;
  }

  .form-label .req { color: var(--primary); margin-left: 2px; }

  .form-input {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .form-input:focus { border-color: var(--primary); }
  .form-input::placeholder { color: var(--text2); }

  select.form-input { appearance: none; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
    animation: fadeIn 0.2s;
    padding: 0;
  }

  .modal {
    background: var(--bg2);
    border-radius: 24px 24px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    width: 100%;
    max-width: 430px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .modal-header {
    padding: 16px 20px 8px;
    font-size: 17px;
    font-weight: 700;
  }

  .modal-body { padding: 8px 20px 0; }

  .modal-footer {
    padding: 16px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    padding: 12px 20px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 380px;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.9); }
    to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }

  .toast.success { background: var(--success); color: #fff; }
  .toast.error { background: var(--danger); color: #fff; }
  .toast.warning { background: var(--warning); color: #000; }
  .toast.info { background: var(--info); color: #fff; }

  /* LIST */
  .list-wrap { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }

  .vehicle-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
  }

  .vehicle-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .vehicle-plate-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--text);
  }

  .badge {
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .badge.yes { background: rgba(255,68,85,0.2); color: var(--danger); }
  .badge.no { background: rgba(0,204,136,0.2); color: var(--success); }
  .badge.related { background: rgba(255,102,0,0.2); color: var(--primary); }
  .badge.unrelated { background: rgba(68,153,255,0.2); color: var(--info); }

  .vehicle-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .info-item { display: flex; flex-direction: column; gap: 2px; }
  .info-lbl { font-size: 10px; color: var(--text2); }
  .info-val { font-size: 13px; color: var(--text); font-weight: 500; }

  /* CAMERA SIM */
  .cam-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
  }

  .cam-icon { font-size: 48px; opacity: 0.3; }
  .cam-txt { font-size: 12px; color: var(--text2); }

  /* PLATE INPUT */
  .plate-input-wrap {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  .plate-input-wrap .form-input {
    flex: 1;
    font-family: 'Bebas Neue', monospace;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* EMPTY STATE */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 40px;
    color: var(--text2);
  }

  .empty-icon { font-size: 48px; opacity: 0.3; }
  .empty-txt { font-size: 14px; text-align: center; line-height: 1.6; }

  /* DATE BADGE */
  .date-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text2);
    margin: 0 16px 12px;
  }

  .date-badge span { color: var(--primary); font-weight: 700; }

  /* UPLOAD AREA */
  .upload-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    gap: 20px;
  }

  .upload-dropzone {
    width: 100%;
    background: var(--card);
    border: 2px dashed var(--border);
    border-radius: 20px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .upload-dropzone:hover { border-color: var(--primary); background: rgba(255,102,0,0.05); }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── 한국 공휴일 (solar) ──
const KR_HOLIDAYS = new Set([
  // 고정 공휴일
  '01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25',
  // 2024 음력 공휴일
  '2024-02-09','2024-02-10','2024-02-11','2024-02-12',
  '2024-04-10','2024-05-06','2024-09-16','2024-09-17','2024-09-18',
  // 2025 음력 공휴일
  '2025-01-28','2025-01-29','2025-01-30',
  '2025-05-05','2025-10-05','2025-10-06','2025-10-07','2025-10-08',
  // 2026 음력 공휴일
  '2026-02-16','2026-02-17','2026-02-18','2026-02-19',
  '2026-09-24','2026-09-25','2026-09-26','2026-09-27',
]);
function isHoliday(year, month, day) {
  const mmdd = `${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const full  = `${year}-${mmdd}`;
  return KR_HOLIDAYS.has(mmdd) || KR_HOLIDAYS.has(full);
}

// ── CalendarPicker ──
function CalendarPicker({ logDates, selDate, onSelect, onClose }) {
  const [ym, setYm] = React.useState(() => {
    const d = new Date(selDate);
    return { year: d.getFullYear(), month: d.getMonth() };
  });
  const today = todayStr();

  function prevMonth() {
    setYm(p => p.month === 0 ? { year:p.year-1, month:11 } : { year:p.year, month:p.month-1 });
  }
  function nextMonth() {
    setYm(p => p.month === 11 ? { year:p.year+1, month:0 } : { year:p.year, month:p.month+1 });
  }

  const firstDay  = new Date(ym.year, ym.month, 1).getDay();
  const daysInMonth = new Date(ym.year, ym.month+1, 0).getDate();
  const cells = [];
  for (let i=0; i<firstDay; i++) cells.push(null);
  for (let d=1; d<=daysInMonth; d++) cells.push(d);

  const logDateSet = new Set(logDates);
  const weekLabels = ['일','월','화','수','목','금','토'];

  function dayStr(d) {
    return `${ym.year}-${String(ym.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  return (
    <div className="cal-overlay" onClick={onClose}>
      <div className="cal-box" onClick={e => e.stopPropagation()}>
        <div className="cal-header">
          <button className="cal-nav" onClick={prevMonth}>‹</button>
          <div className="cal-title">{ym.year}년 {ym.month+1}월</div>
          <button className="cal-nav" onClick={nextMonth}>›</button>
        </div>
        <div className="cal-weekdays">
          {weekLabels.map((l,i) => (
            <div key={l} className={`cal-weekday ${i===0?'sun':i===6?'sat':''}`}>{l}</div>
          ))}
        </div>
        <div className="cal-grid">
          {cells.map((d, i) => {
            if (!d) return <div key={`e${i}`} className="cal-day empty"/>;
            const ds  = dayStr(d);
            const dow = (firstDay + d - 1) % 7;
            const hol = isHoliday(ym.year, ym.month+1, d);
            const hasDot = logDateSet.has(ds);
            const isSel = ds === selDate;
            const isToday = ds === today;
            const cls = [
              'cal-day',
              hol || dow===0 ? 'holiday' : dow===6 ? 'sat' : '',
              isToday && !isSel ? 'today' : '',
              isSel ? 'selected' : '',
            ].filter(Boolean).join(' ');
            return (
              <div key={ds} className={cls} onClick={() => { onSelect(ds); onClose(); }}>
                {d}
                {hasDot && <div className="cal-dot"/>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── PhoneInput: 연락처 연동 입력 ──
function PhoneInput({ value, onChange, placeholder }) {
  const [suggestions, setSuggestions] = React.useState([]);
  const hasContacts = typeof navigator !== 'undefined' && navigator.contacts && navigator.contacts.select;

  async function pickContact() {
    try {
      const results = await navigator.contacts.select(['name','tel'], { multiple:false });
      if (results && results.length > 0) {
        const tel = (results[0].tel || [])[0] || '';
        onChange(tel.replace(/\s/g,''));
      }
    } catch(e) { /* 취소 또는 미지원 */ }
  }

  function handleChange(v) {
    onChange(v);
  }

  return (
    <div style={{position:'relative'}}>
      <div style={{display:'flex', gap:6}}>
        <input
          className="form-input"
          type="tel"
          value={value}
          onChange={e => handleChange(e.target.value)}

          style={{flex:1}}

          <button

}

// ── SwipeCard: 왼쪽 스와이프 시 삭제 버튼 노출 ──
function SwipeCard({ onDelete, children }) {
  const [offsetX, setOffsetX] = React.useState(0);
  const [open, setOpen]       = React.useState(false);
  const startX = React.useRef(null);
  const cardRef = React.useRef(null);
  const THRESHOLD = 60;
  const OPEN_W    = 90;

  function onTouchStart(e) {
    startX.current = e.touches[0].clientX;
  }

  function onTouchMove(e) {
    if (startX.current === null) return;
    const dx = e.touches[0].clientX - startX.current;
    if (dx > 0 && !open) return; // 오른쪽 스와이프는 무시
    const base = open ? -OPEN_W : 0;
    const next = Math.max(-OPEN_W, Math.min(0, base + dx));
    setOffsetX(next);
  }

  function onTouchEnd() {
    if (startX.current === null) return;
    if (offsetX < -THRESHOLD) {
      setOffsetX(-OPEN_W);
      setOpen(true);
    } else {
      setOffsetX(0);
      setOpen(false);
    }
    startX.current = null;
  }

  function handleDelete(e) {
    e.stopPropagation();
    setOffsetX(0);
    setOpen(false);
    onDelete();
  }

  function closeSwipe() {
    setOffsetX(0);
    setOpen(false);
  }

  return (
    <div className="swipe-wrap" onClick={open ? closeSwipe : undefined}>
      <div className="swipe-delete-bg">
        <span onClick={handleDelete}>🗑️<span>삭제</span></span>
      </div>
      <div
        ref={cardRef}
        className="swipe-card"
        style={{ transform: `translateX(${offsetX}px)` }}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >
        {children}
      </div>
    </div>
  );
}

  function doBackup() {
    const data = { vehicles, log, backupAt: new Date().toISOString(), version: 1 };

    const url  = URL.createObjectURL(blob);
    const today2 = new Date().toISOString().slice(0,10);
    const a = document.createElement('a');
    a.href = url;
    a.download = `주차관리_백업_${today2}.json`;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    setToast({ msg:`✅ 백업 파일이 저장되었습니다.`, type:'success' });
  }

  function handleRestoreFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.vehicles || !data.log) throw new Error('올바른 백업 파일이 아닙니다.');

      } catch(err) {
        setToast({ msg:`복원 실패: ${err.message}`, type:'error' });
      }
      e.target.value = '';
    };
    reader.onerror = () => setToast({ msg:'파일 읽기 오류', type:'error' });
    reader.readAsText(file, 'UTF-8');
  }

// ── Screen: BLACK LIST ──
function BlackListScreen({ onBack, vehicles, log, stickers }) {
  const [popupVeh, setPopupVeh] = useState(null);

  // 당사 미관련 차량만
  const unrelated = vehicles.filter(v => v.related !== 'YES');

  // 단속 횟수 집계
  const enfMap = {};
  log.forEach(l => {
    const v = vehicles.find(vv => vv.plate === l.plate);
    if (v && v.related !== 'YES') {
      enfMap[l.plate] = (enfMap[l.plate] || 0) + 1;
    }
  });

  // 정렬: 1순위 스티커 내림차순, 2순위 단속 내림차순
  const rows = unrelated.map(v => ({
    ...v,
    enf:    enfMap[v.plate]  || 0,
    sticker: stickers[v.plate] || 0,
  })).sort((a, b) =>
    b.sticker !== a.sticker ? b.sticker - a.sticker : b.enf - a.enf
  ).filter(r => r.enf > 0 || r.sticker > 0); // 0건은 제외

  function rankCls(i) {
    if (i === 0) return 'r1';
    if (i === 1) return 'r2';
    if (i === 2) return 'r3';
    return 'rn';
  }

  return (
    <div className="screen">
      <div className="header">
        <div className="back-btn" onClick={onBack}>←</div>
        <div>
          <div className="header-title" style={{color:'var(--danger)'}}>🚫 BLACK LIST</div>
          <div className="header-sub">당사 미관련 차량 단속·스티커 현황</div>
        </div>
      </div>

      {rows.length === 0
        ? <div className="empty-state">
            <div className="empty-icon">🚗</div>
            <div className="empty-txt">단속 이력이 있는<br/>미관련 차량이 없습니다.</div>
          </div>
        : <div style={{padding:'12px 16px', flex:1, overflowY:'auto'}}>
            <div style={{
              background:'var(--card)', border:'1px solid var(--border)',
              borderRadius:16, overflow:'hidden'
            }}>
              <table className="bl-table">
                <thead>
                  <tr>
                    <th style={{width:'48%'}}>차량번호</th>
                    <th style={{width:'26%'}}>단속</th>
                    <th style={{width:'26%'}}>스티커</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={r.plate}>
                      <td>
                        <div style={{display:'flex', alignItems:'center'}}>
                          <span className={`bl-rank ${rankCls(i)}`}>{i+1}</span>
                          <button className="bl-plate-btn" onClick={() => setPopupVeh(r)}>
                            {r.plate}
                          </button>
                        </div>
                      </td>
                      <td className={r.enf > 0 ? 'bl-enf' : 'bl-zero'}>{r.enf > 0 ? r.enf : '-'}</td>
                      <td className={r.sticker > 0 ? 'bl-stk' : 'bl-zero'}>{r.sticker > 0 ? r.sticker : '-'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{fontSize:11, color:'var(--text2)', textAlign:'center', marginTop:12}}>
              총 {rows.length}대 · 단속 또는 스티커 이력 있는 차량만 표시
            </div>
          </div>
      }

      <div style={{padding:'12px 16px 36px', marginTop:'auto', display:'flex', flexDirection:'column', gap:10}}>
        <button
          className="btn"
          style={{background:'rgba(0,204,136,0.1)', border:'1px solid rgba(0,204,136,0.35)', color:'var(--success)', fontWeight:700}}
          onClick={() => {
            if (rows.length === 0) { return; }
            if (typeof XLSX === 'undefined') { alert('XLSX 라이브러리 로딩 중입니다. 잠시 후 다시 시도해 주세요.'); return; }
            try {
              const today = new Date().toISOString().slice(0,10);
              const filename = `BlackList_${today}.xlsx`;
              const wsData = [
                ['차량번호','소속','소유주','전화번호','단속횟수','스티커발부횟수'],
                ...rows.map(r => [r.plate, r.dept||'', r.owner||'', r.phone||'', r.enf, r.sticker])
              ];
              const wb = XLSX.utils.book_new();
              const ws = XLSX.utils.aoa_to_sheet(wsData);
              ws['!cols'] = [{wch:14},{wch:14},{wch:10},{wch:16},{wch:10},{wch:14}];
              XLSX.utils.book_append_sheet(wb, ws, 'BlackList');
              const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
              const blob  = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
              const url   = URL.createObjectURL(blob);
              const a     = document.createElement('a');
              a.href = url; a.download = filename; a.style.display = 'none';
              document.body.appendChild(a); a.click();
              setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
            } catch(err) { alert('저장 오류: ' + err.message); }

        >📥 Black List 엑셀 다운로드</button>
        <button
          className="btn"
          style={{background:'rgba(68,153,255,0.1)', border:'1px solid rgba(68,153,255,0.35)', color:'var(--info)', fontWeight:700}}
          onClick={() => {
            if (rows.length === 0) return;
            const today = new Date().toISOString().slice(0,10);
            const filename = `BlackList_${today}.xlsx`;
            const subject = encodeURIComponent(`[주차관리] Black List 현황 ${today}`);

              `기준일: ${today}\n대상 차량: ${rows.length}대\n\n` +
              `다운로드된 첨부파일(${filename})을 확인해 주세요.\n` +
              `(파일 위치: 다운로드 폴더)`
            );
            window.location.href = `mailto:sw777.yang@hanwha.com?subject=${subject}&body=${body}`;
          }}
        >📧 Black List 이메일 전송</button>
        <button className="btn btn-secondary" onClick={onBack}>← 앞으로 (메인화면)</button>
      </div>

      {/* 차량 정보 팝업 */}
      {popupVeh && (
        <div className="modal-overlay" onClick={() => setPopupVeh(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-handle"/>
            <div className="modal-header" style={{fontFamily:'Bebas Neue,monospace', fontSize:22, letterSpacing:3, color:'var(--primary)'}}>
              {popupVeh.plate}
            </div>
            <div className="modal-body">
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, paddingBottom:8}}>
                {[
                  ['차종',     popupVeh.type  || '-'],
                  ['소속',     popupVeh.dept  || '-'],
                  ['소유주',   popupVeh.owner || '-'],

                    <div style={{fontSize:14, fontWeight:600, color:'var(--text)'}}>{val}</div>

// ── Screen: CAMERA ──
function CameraScreen({ onBack, vehicles, setVehicles, log, setLog }) {
  const [plate, setPlate]               = useState('');
  const [photoSrc, setPhotoSrc]         = useState(null);
  const [status, setStatus]             = useState('idle'); // idle | scanning | hasPlate
  const [showRegister, setShowRegister] = useState(false);
  const [showRelated, setShowRelated]   = useState(false);
  const [toast, setToast]               = useState(null);
  const [apiKey, setApiKey]             = useState(loadApiKey);
  const [showApiKey, setShowApiKey]     = useState(false);
  const [scanLog, setScanLog]           = useState('');
  const [zone, setZone]                 = useState(null); // null | 'general' | 'customer'
  const captureRef = useRef(null);
  const uploadRef  = useRef(null);

  const MSG      = loadMsg();
  const CUST_MSG = loadCustMsg();

  function showToast(msg, type) { setToast({ msg, type }); }

  function saveKey(k) { setApiKey(k); saveApiKey(k); }

  // 이미지를 canvas로 리사이즈 → base64 반환
  function resizeImage(file, maxW, maxH) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW || h > maxH) {
          const ratio = Math.min(maxW / w, maxH / h);
          w = Math.round(w * ratio); h = Math.round(h * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  async function handleImageFile(file) {
    if (!file) return;
    const previewUrl = URL.createObjectURL(file);
    setPhotoSrc(previewUrl);
    setPlate('');
    setScanLog('');
    setStatus('scanning');

    const key = loadApiKey();
    if (!key) {
      setScanLog('API 키가 설정되지 않았습니다.');
      showToast('API 키를 먼저 설정해 주세요.', 'error');
      setStatus('hasPlate');
      return;
    }

    // 이미지 리사이즈 (최대 1280x960)
    const b64 = await resizeImage(file, 1280, 960);
    if (!b64) {
      showToast('이미지 처리 오류. 직접 입력해 주세요.', 'error');
      setStatus('hasPlate');
      return;
    }

    await scanPlate(b64, key);
  }

  async function scanPlate(b64, key) {
    setScanLog('API 호출 중...');
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-opus-4-6',
          max_tokens: 50,
          messages: [{
            role: 'user',
            content: [
              { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
              { type: 'text', text: '이 사진에서 자동차 번호판을 찾아서 번호만 알려줘. 한국 번호판 형식(예: 12가3456, 123가4567, 서울12가3456)으로 공백없이 답해. 번호판이 보이지 않으면 "없음"이라고만 답해. 번호판 번호 외 다른 말은 하지 마.' }
            ]
          }]
        })
      });

      setScanLog(`HTTP ${res.status}`);

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const msg = err?.error?.message || `오류 코드 ${res.status}`;
        setScanLog(`오류: ${msg}`);
        showToast(`인식 실패: ${msg}`, 'error');
        setStatus('hasPlate');
        return;
      }

      const data = await res.json();
      const raw = (data.content?.[0]?.text || '').trim();
      setScanLog(`응답: ${raw}`);

      // 번호판 패턴 추출 (숫자+한글 조합)
      const match = raw.match(/[가-힣0-9]{4,10}/);
      const detected = match ? match[0] : '';

      if (!detected || raw === '없음' || raw.includes('없음')) {
        showToast('번호판을 인식하지 못했습니다. 직접 입력해 주세요.', 'warning');
        setPlate('');
      } else {
        setPlate(detected.toUpperCase());
        showToast(`✅ 번호 인식: ${detected}`, 'success');
      }
    } catch(e) {
      setScanLog(`예외: ${e.message}`);
      showToast(`연결 오류: ${e.message}`, 'error');
    }
    setStatus('hasPlate');
  }

  function processPlate(p) {
    const found = vehicles.find(v => v.plate === p);

    // ── 면제 여부 판단 ──
    let exempt = false;
    let exemptReason = '';
    if (zone === 'general') {
      // 일반 구역: 당사관련(YES)이면 면제
      if (found && found.related === 'YES') { exempt = true; exemptReason = '당사 관련 차량입니다.'; }
    } else {
      // 고객 구역: 고객(YES)이면 면제
      if (found && found.customer === 'YES') { exempt = true; exemptReason = '고객 차량입니다.'; }
    }

    if (!found) {
      showToast('차량이 등록되지 않았습니다.', 'warning');
      setShowRegister(true);
    } else if (exempt) {
      addLog(p, zone === 'general' ? '당사관련' : '고객차량');
      setShowRelated(true);
    } else {
      const phone = (found.phone || '').replace(/-/g, '');
      const useMsg = zone === 'customer' ? CUST_MSG : MSG;
      addLog(p, '메시지전송');
      reset();
      const onVisible = () => {
        if (document.visibilityState === 'visible') {
          document.removeEventListener('visibilitychange', onVisible);
          setTimeout(() => { if (captureRef.current) captureRef.current.click(); }, 400);
        }
      };
      document.addEventListener('visibilitychange', onVisible);
      setTimeout(() => document.removeEventListener('visibilitychange', onVisible), 10000);
      window.location.href = `sms:${phone}?body=${encodeURIComponent(useMsg)}`;
    }
  }



  function confirmPlate() {
    const p = plate.trim().toUpperCase();
    if (!p) { showToast('번호판을 입력해 주세요.', 'error'); return; }
    processPlate(p);
  }

  function addLog(p, action) {
    const newLog = [...log, { plate: p, action, date: todayStr(), time: now() }];
    setLog(newLog); saveLog(newLog);
  }

  function reset() {
    setPlate(''); setPhotoSrc(null); setScanLog('');
    setStatus('idle'); setShowRelated(false); setShowRegister(false);
    if (captureRef.current) captureRef.current.value = '';
    if (uploadRef.current)  uploadRef.current.value  = '';
  }

  function handleRegister(form) {
    const newList = [...vehicles, form];
    setVehicles(newList); saveVehicles(newList);

// ── Screen: EXCEL ──
function ExcelScreen({ onBack, vehicles, setVehicles, setToast }) {
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const fileRef = useRef();
  const [toast, setLocalToast] = useState(null);

  function showToast(msg, type) { setLocalToast({ msg, type }); }

  function parseCSV(text, origEvent) {
    const clean = (text.charCodeAt(0) === 0xFEFF) ? text.slice(1) : text;
    const lines = clean.split(/\r?\n/).filter(l => l.trim());
    const dataLines = lines.slice(1);
    let registered = 0, duplicated = 0;
    const current = [...vehicles];
    const existingPlates = new Set(current.map(v => v.plate));
    for (const line of dataLines) {
      const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
      if (!cols[0]) continue;
      const [plate, type, dept, owner, phone, related] = cols;
      if (existingPlates.has(plate)) { duplicated++; continue; }
      current.push({ plate, type: type||'', dept: dept||'', owner: owner||'', phone: phone||'', related: (related||'NO').toUpperCase() === 'YES' ? 'YES' : 'NO' });
      existingPlates.add(plate);
      registered++;
    }
    setVehicles(current);
    saveVehicles(current);
    setResult({ registered, duplicated });
    setLoading(false);
    if (origEvent) origEvent.target.value = '';
  }

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.csv')) { showToast('CSV 파일만 업로드 가능합니다.', 'error'); return; }
    setLoading(true);

    const tryDecode = (encodings, idx, onSuccess, onFail) => {
      if (idx >= encodings.length) { onFail(); return; }
      const reader = new FileReader();
      reader.onload = (ev) => {
        const text = ev.target.result;
        // 한글(가-힣)이 포함돼 있으면 성공, 없으면 다음 인코딩 시도
        const hasKorean = /[가-힣]/.test(text);
        const hasGarbled = /[\uFFFD\u00C0-\u00FF\u0080-\u009F]/.test(text);
        if (hasKorean || (!hasGarbled && idx === encodings.length - 1)) {
          onSuccess(text);
        } else {
          tryDecode(encodings, idx + 1, onSuccess, onFail);
        }
      };
      reader.onerror = () => tryDecode(encodings, idx + 1, onSuccess, onFail);
      reader.readAsText(file, encodings[idx]);
    };

    // EUC-KR 우선 시도 (엑셀 기본 저장이 EUC-KR이므로)
    tryDecode(
      ['EUC-KR', 'CP949', 'UTF-8'],
      0,
      (text) => { try { parseCSV(text, e); } catch(err) { showToast('파싱 오류: ' + err.message, 'error'); setLoading(false); } },
      ()     => { showToast('파일 인코딩을 인식할 수 없습니다.', 'error'); setLoading(false); }
    );
  }

  return (
    <div className="screen">
      <div className="header">
        <div className="back-btn" onClick={onBack}>←</div>
        <div>
          <div className="header-title">차량데이터 입력 (엑셀)</div>
          <div className="header-sub">CSV 파일로 일괄 등록</div>
        </div>
      </div>
      {toast && <Toast {...toast} onDone={() => setLocalToast(null)}/>}
      <div className="upload-area">
        {result ? (
          <>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, width:'100%'}}>
              <div className="result-card">
                <div className="result-num" style={{color:'var(--success)'}}>{result.registered}</div>
                <div className="result-lbl">등록 완료</div>
              </div>
              <div className="result-card">
                <div className="result-num" style={{color:'var(--warning)'}}>{result.duplicated}</div>
                <div className="result-lbl">중복 미등록</div>
              </div>
            </div>
            <div style={{fontSize:13, color:'var(--text2)', textAlign:'center'}}>
              등록 {result.registered}건, 중복 미등록 {result.duplicated}건
            </div>
            <button className="btn btn-secondary" onClick={() => setResult(null)}>다른 파일 업로드</button>
          </>
        ) : (
          <>
            <div className="upload-dropzone" onClick={() => fileRef.current.click()}>
              <div className="upload-icon">📂</div>
              <div className="upload-txt">
                <strong>CSV 파일을 선택해 주세요</strong>
                탭하여 파일 탐색기 열기<br/>
                <span style={{fontSize:11, color:'var(--border)'}}>형식: 차량번호, 차종, 소속, 소유주, 전화번호, 당사관련</span>
              </div>
            </div>
            <input ref={fileRef} type="file" accept=".csv" style={{display:'none'}} onChange={handleFile}/>
            {loading && <div style={{color:'var(--text2)',fontSize:13}}>처리 중...</div>}
          </>
        )}
        <button className="btn btn-secondary" style={{marginTop:'auto'}} onClick={onBack}>← 앞으로 (메인화면)</button>
      </div>
    </div>
  );
}

function TodayScreen({ onBack, log, setLog, vehicles, stickers, setStickers }) {
  const logDates = Array.from(new Set(log.map(l => l.date)));
  const [selDate, setSelDate] = useState(todayStr());
  const [showCal, setShowCal] = useState(false);
  const [toast, setToast]     = useState(null);

  const dateLog = log.filter(l => l.date === selDate).reverse();

  // 통계
  const totalCount   = dateLog.length;
  const relatedCount = dateLog.filter(e => {
    const v = vehicles.find(vv => vv.plate === e.plate);
    return v && v.related === 'YES';
  }).length;
  const unrelatedCount = totalCount - relatedCount;

  const formatted = (d) => {
    const [y,m,dd] = d.split('-');
    return new Date(y,m-1,dd).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  };

  const MSG = loadMsg();

  function sendMsg(phone) {
    if (!phone) { setToast({ msg:'전화번호가 없습니다.', type:'error' }); return; }
    window.location.href = `sms:${phone.replace(/-/g,'')}?body=${encodeURIComponent(MSG)}`;
  }

  function deleteEntry(idx) {
    const entry = dateLog[idx];
    let removed = false;
    const newLog = log.filter(l => {
      if (!removed && l.date===entry.date && l.plate===entry.plate && l.time===entry.time && l.action===entry.action) {
        removed = true; return false;
      }
      return true;
    });
    setLog(newLog); saveLog(newLog);
    setToast({ msg:'항목이 삭제되었습니다.', type:'info' });
  }

  function addSticker(plate) {
    const next = { ...stickers, [plate]: (stickers[plate] || 0) + 1 };
    setStickers(next); saveStickers(next);
    setToast({ msg:`🚫 ${plate} 스티커 발부 (누계: ${next[plate]}회)`, type:'warning' });
  }

  return (
    <div className="screen">
      <div className="header">
        <div className="back-btn" onClick={onBack}>←</div>
        <div>
          <div className="header-title">일일 현황</div>
          <div className="header-sub">날짜별 단속 이력</div>
        </div>
      </div>
      {toast && <Toast {...toast} onDone={() => setToast(null)}/>}
      {showCal && (
        <CalendarPicker
          logDates={logDates}
          selDate={selDate}
          onSelect={d => setSelDate(d)}
          onClose={() => setShowCal(false)}
        />
      )}

      {/* 날짜 선택 버튼 */}
      <div style={{padding:'10px 16px 4px'}}>
        <button
          onClick={() => setShowCal(true)}
          style={{
            width:'100%', background:'var(--card)', border:'1px solid var(--border)',
            borderRadius:12, padding:'12px 16px', color:'var(--text)',
            fontSize:14, fontWeight:600, cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'space-between'
          }}
        >
          <span>📅 {formatted(selDate)}{selDate===todayStr()?' (오늘)':''}</span>
          <span style={{color:'var(--text2)', fontSize:18}}>▾</span>
        </button>
      </div>

      {/* 통계 */}
      <div className="today-stats">
        <div className="today-stat">
          <div className="today-stat-val" style={{color:'var(--primary)'}}>{totalCount}</div>
          <div className="today-stat-lbl">총 단속</div>
        </div>
        <div className="today-stat">
          <div className="today-stat-val" style={{color:'var(--info)'}}>{relatedCount}</div>
          <div className="today-stat-lbl">당사 관련</div>
        </div>
        <div className="today-stat">
          <div className="today-stat-val" style={{color:'var(--danger)'}}>{unrelatedCount}</div>
          <div className="today-stat-lbl">당사 미관련</div>
        </div>
      </div>

      {dateLog.length === 0
        ? <div className="empty-state">
            <div className="empty-icon">🚗</div>
            <div className="empty-txt">해당 날짜에 단속 이력이 없습니다.</div>
          </div>
        : <>
            <div className="count-badge">총 <strong>{dateLog.length}건</strong></div>
            <div className="list-wrap">

                      <div className="vehicle-info-grid">

                        <div className="info-item"><div className="info-lbl">소속</div><div className="info-val">{veh.dept||'-'}</div></div>
                        <div className="info-item"><div className="info-lbl">소유주</div><div className="info-val">{veh.owner||'-'}</div></div>
                        <div className="info-item"><div className="info-lbl">전화번호</div><div className="info-val">{veh.phone||'-'}</div></div>
                      </div>
                    )}
                    {!isRelated && (
                      <div style={{marginTop:10, display:'flex', gap:8}}>
                        <button className="btn" style={{flex:1, padding:'10px', fontSize:12, fontWeight:700,
                          background:'rgba(255,102,0,0.12)', border:'1px solid rgba(255,102,0,0.35)',
                          color:'var(--primary)', borderRadius:12}}

                        >📨 이동요청 문자</button>
                        <button className="btn" style={{flex:1, padding:'10px', fontSize:12, fontWeight:700,
                          background:'rgba(255,68,85,0.12)', border:'1px solid rgba(255,68,85,0.35)',
                          color:'var(--danger)', borderRadius:12}}
                          onClick={() => addSticker(entry.plate)}
                        >🚫 스티커 발부{stickerCnt > 0 ? ` (${stickerCnt})` : ''}</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </>
      }
      <div style={{padding:'12px 16px 36px', display:'flex', flexDirection:'column', gap:10, marginTop:'auto'}}>
        <button className="btn"
          style={{background:'rgba(68,153,255,0.12)', border:'1px solid rgba(68,153,255,0.35)', color:'var(--info)', fontWeight:700}}
          onClick={() => {
            if (dateLog.length === 0) return;
            const subject = encodeURIComponent(`[주차단속] ${formatted(selDate)} 단속 내역`);
            const plateList = dateLog.map(e => e.plate).join('%0A');
            const body = encodeURIComponent(`${formatted(selDate)} 주차단속 내역입니다.\n\n`) + plateList;
            window.location.href = `mailto:sw777.yang@hanwha.com?subject=${subject}&body=${body}`;
          }}

// ── Screen: ALL VEHICLES ──
function AllVehiclesScreen({ onBack, vehicles, setVehicles, log, stickers }) {
  const [query, setQuery]             = useState('');
  const [filter, setFilter]           = useState('all'); // all | unrelated | related | customer
  const [showConfirm, setShowConfirm] = useState(false);
  const [toast, setToast]             = useState(null);
  const [editTarget, setEditTarget]   = useState(null);
  const [editForm, setEditForm]       = useState(null);

  const filtered = vehicles.filter(v => {
    // 카테고리 필터
    const passFilter =
      filter === 'all'       ? true :
      filter === 'related'   ? v.related === 'YES' && v.customer !== 'YES' :
      filter === 'customer'  ? v.customer === 'YES' :
      filter === 'unrelated' ? v.related !== 'YES' && v.customer !== 'YES' :
      true;
    if (!passFilter) return false;
    // 검색 필터
    return (
      v.plate.includes(query.toUpperCase()) ||
      (v.owner||'').includes(query) ||
      (v.dept||'').includes(query) ||
      (v.type||'').includes(query)
    );
  });

  // 카테고리별 카운트
  const cntAll       = vehicles.length;
  const cntRelated   = vehicles.filter(v => v.related === 'YES' && v.customer !== 'YES').length;
  const cntCustomer  = vehicles.filter(v => v.customer === 'YES').length;
  const cntUnrelated = vehicles.filter(v => v.related !== 'YES' && v.customer !== 'YES').length;

  const FILTER_BTNS = [
    { key:'all',       label:'전체',         cnt: cntAll,       color:'var(--text2)',    bg:'var(--bg3)' },
    { key:'unrelated', label:'당사 미관련',  cnt: cntUnrelated, color:'var(--danger)',   bg:'rgba(255,68,85,0.12)' },
    { key:'related',   label:'당사 관련',    cnt: cntRelated,   color:'var(--primary)',  bg:'rgba(255,102,0,0.12)' },
    { key:'customer',  label:'고객 차량',    cnt: cntCustomer,  color:'var(--info)',     bg:'rgba(68,153,255,0.12)' },
  ];

  function deleteVehicle(plate) {
    const newList = vehicles.filter(v => v.plate !== plate);
    setVehicles(newList); saveVehicles(newList);
    setToast({ msg:`${plate} 삭제되었습니다.`, type:'info' });
  }

  function deleteAll() {
    setVehicles([]); saveVehicles([]);
    setShowConfirm(false);
    setToast({ msg:'전체 차량데이터가 삭제되었습니다.', type:'info' });
  }

  function downloadXlsx(list) {
    if (list.length === 0) { setToast({ msg:'등록된 차량 데이터가 없습니다.', type:'warning' }); return; }
    if (typeof XLSX === 'undefined') { setToast({ msg:'XLSX 라이브러리 로딩 중입니다. 잠시 후 다시 시도해 주세요.', type:'warning' }); return; }
    try {
      const today = new Date().toISOString().slice(0,10);
      const filename = `차량데이터_${today}.xlsx`;
      const wsData = [
        ['차량번호', '차종', '소속', '소유주', '전화번호', '당사관련'],
        ...list.map(v => [v.plate||'', v.type||'', v.dept||'', v.owner||'', v.phone||'', v.related||''])
      ];
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      ws['!cols'] = [{ wch:14 },{ wch:12 },{ wch:14 },{ wch:10 },{ wch:16 },{ wch:10 }];
      XLSX.utils.book_append_sheet(wb, ws, '차량데이터');
      const wbout = XLSX.write(wb, { bookType:'xlsx', type:'array' });
      const blob  = new Blob([wbout], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement('a');
      a.href = url; a.download = filename; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
      setToast({ msg:`✅ ${filename} 저장 완료!`, type:'success' });
    } catch(err) {
      setToast({ msg:`저장 오류: ${err.message}`, type:'error' });
    }
  }

  function sendEmail(list) {
    if (list.length === 0) { setToast({ msg:'등록된 차량 데이터가 없습니다.', type:'warning' }); return; }
    const today = new Date().toISOString().slice(0,10);
    const filename = `차량데이터_${today}.xlsx`;
    const subject = encodeURIComponent(`[주차관리] 전체 차량데이터 ${today}`);
    const body = encodeURIComponent(
      `안녕하세요.\n\n한화파워 주차관리 시스템에서 전체 차량데이터를 전송합니다.\n\n` +
      `기준일: ${today}\n등록 차량 수: ${list.length}대\n\n` +
      `다운로드된 파일(${filename})을 메일에 첨부하여 전송해 주세요.\n(파일 위치: 다운로드 폴더)`
    );
    window.location.href = `mailto:sw777.yang@hanwha.com?subject=${subject}&body=${body}`;
  }

  function openEdit(v) {
    setEditTarget(v.plate);
    setEditForm({ ...v });
  }

  function closeEdit() {
    setEditTarget(null);
    setEditForm(null);
  }

  function saveEdit() {
    if (!editForm.plate.trim()) { setToast({ msg:'차량번호는 필수입니다.', type:'error' }); return; }
    if (!editForm.phone.trim()) { setToast({ msg:'전화번호는 필수입니다.', type:'error' }); return; }
    // 번호판이 바뀐 경우 중복 체크
    if (editForm.plate !== editTarget && vehicles.find(v => v.plate === editForm.plate)) {
      setToast({ msg:'이미 등록된 차량번호입니다.', type:'error' }); return;
    }
    const newList = vehicles.map(v => v.plate === editTarget ? { ...editForm, plate: editForm.plate.toUpperCase() } : v);
    setVehicles(newList); saveVehicles(newList);
    setToast({ msg:'수정이 완료되었습니다.', type:'success' });
    closeEdit();
  }

  const setF = (k, val) => setEditForm(f => ({ ...f, [k]: val }));

  return (
    <div className="screen">
      <div className="header">
        <div className="back-btn" onClick={onBack}>←</div>
        <div>
          <div className="header-title">차량데이터 현황</div>
          <div className="header-sub">탭: 수정 · 스와이프←: 삭제</div>
        </div>
      </div>
      {toast && <Toast {...toast} onDone={() => setToast(null)}/>}
      <div className="search-wrap">
        <input className="search-input" placeholder="번호판, 소유주, 소속 검색…" value={query} onChange={e => setQuery(e.target.value)}/>
      </div>

      {/* 카테고리 필터 버튼 */}
      <div style={{padding:'8px 16px 4px', display:'flex', gap:6, overflowX:'auto'}}>
        {FILTER_BTNS.map(b => (
          <button key={b.key} onClick={() => setFilter(b.key)}
            style={{
              flexShrink:0, padding:'6px 12px', borderRadius:100, border:`1px solid ${filter===b.key ? b.color : 'var(--border)'}`,
              background: filter===b.key ? b.bg : 'var(--bg3)',
              color: filter===b.key ? b.color : 'var(--text2)',
              fontSize:12, fontWeight:700, cursor:'pointer',
              transition:'all 0.15s'
            }}
          >{b.label} <span style={{opacity:0.8}}>({b.cnt})</span></button>
        ))}
      </div>

      {vehicles.length === 0
        ? <div className="empty-state">
            <div className="empty-icon">🗂️</div>
            <div className="empty-txt">등록된 차량이 없습니다.<br/>엑셀 또는 직접 입력으로 등록해 주세요.</div>
          </div>
        : <>
            <div className="count-badge">전체 <strong>{vehicles.length}</strong>대 · 표시 <strong>{filtered.length}</strong>대</div>
            <div className="list-wrap">
              {filtered.map((v) => (
                <SwipeCard key={v.plate} onDelete={() => deleteVehicle(v.plate)}>
                  {/* 카드 탭 → 수정 모달 열기 */}
                  <div onClick={() => openEdit(v)} style={{cursor:'pointer'}}>
                    <div className="vehicle-card-top">
                      <div className="vehicle-plate-badge">{v.plate}</div>
                      <div style={{display:'flex', gap:6, alignItems:'center'}}>
                        <span className={`badge ${v.related==='YES'?'related':'unrelated'}`}>
                          {v.related==='YES'?'당사 관련':'외부 차량'}
                        </span>
                        {v.customer==='YES' && <span className="badge" style={{background:'rgba(68,153,255,0.2)',color:'var(--info)'}}>👤 고객</span>}
                        <span style={{fontSize:11, color:'var(--text2)'}}>✎</span>
                      </div>
                    </div>
                    <div className="vehicle-info-grid">
                      <div className="info-item"><div className="info-lbl">차종</div><div className="info-val">{v.type||'-'}</div></div>
                      <div className="info-item"><div className="info-lbl">소속</div><div className="info-val">{v.dept||'-'}</div></div>
                      <div className="info-item"><div className="info-lbl">소유주</div><div className="info-val">{v.owner||'-'}</div></div>
                      <div className="info-item"><div className="info-lbl">전화번호</div><div className="info-val">{v.phone}</div></div>
                    </div>
                    {v.related !== 'YES' && (() => {
                      const enfCount    = log.filter(l => l.plate === v.plate).length;
                      const stickerCount = stickers[v.plate] || 0;
                      return (
                        <div style={{display:'flex', gap:8, marginTop:8}}>
                          <div style={{flex:1, background:'rgba(255,102,0,0.08)', border:'1px solid rgba(255,102,0,0.2)',
                            borderRadius:10, padding:'6px 10px', textAlign:'center'}}>
                            <div style={{fontSize:16, fontWeight:900, color:'var(--primary)'}}>{enfCount}</div>
                            <div style={{fontSize:10, color:'var(--text2)'}}>단속 횟수</div>
                          </div>
                          <div style={{flex:1, background:'rgba(255,68,85,0.08)', border:'1px solid rgba(255,68,85,0.2)',
                            borderRadius:10, padding:'6px 10px', textAlign:'center'}}>
                            <div style={{fontSize:16, fontWeight:900, color:'var(--danger)'}}>{stickerCount}</div>
                            <div style={{fontSize:10, color:'var(--text2)'}}>스티커 발부</div>
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                </SwipeCard>
              ))}
            </div>
          </>
      }
      <div style={{padding:'12px 16px 36px', display:'flex', flexDirection:'column', gap:10, marginTop:'auto'}}>
        <button
          className="btn"
          style={{background:'rgba(0,204,136,0.1)', border:'1px solid rgba(0,204,136,0.35)', color:'var(--success)', fontWeight:700}}
          onClick={() => downloadXlsx(vehicles)}
        >📥 차량데이터 엑셀 다운로드</button>
        <button
          className="btn"
          style={{background:'rgba(68,153,255,0.1)', border:'1px solid rgba(68,153,255,0.35)', color:'var(--info)', fontWeight:700}}
          onClick={() => sendEmail(vehicles)}
        >📧 이메일 전송</button>
        <button
          className="btn"
          style={{background:'rgba(255,68,85,0.1)', border:'1px solid rgba(255,68,85,0.35)', color:'var(--danger)', fontWeight:700}}
          onClick={() => setShowConfirm(true)}
        >🗑️ 전체 차량데이터 삭제</button>
        <button className="btn btn-secondary" onClick={onBack}>← 앞으로 (메인화면)</button>
      </div>

      {/* 전체 삭제 확인 모달 */}
      {showConfirm && (
        <div className="modal-overlay" onClick={() => setShowConfirm(false)}>
          <div className="alert-modal" onClick={e => e.stopPropagation()}>

            <div className="alert-title">전체 차량데이터 삭제</div>

            <button className="btn btn-danger" style={{marginBottom:10}} onClick={deleteAll}>🗑️ 네, 전체 삭제합니다</button>

          </div>

      {/* 수정 모달 */}
      {editForm && (
        <div className="modal-overlay" onClick={closeEdit}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-handle"/>
            <div className="modal-header">✎ 차량 정보 수정</div>
            <div className="modal-body">
              <div className="form-wrap" style={{padding:0, gap:10}}>

                  <label className="form-label">차량번호 <span className="req">*</span></label>
                  <input className="form-input"
                    style={{fontFamily:'Bebas Neue,monospace', fontSize:22, letterSpacing:3}}
                    value={editForm.plate}
                    onChange={e => setF('plate', e.target.value.toUpperCase())}
                    placeholder="12가3456"/>
                </div>
                <div className="form-group">
                  <label className="form-label">차종</label>
                  <input className="form-input" value={editForm.type} onChange={e => setF('type', e.target.value)} placeholder="예: 소나타"/>
                </div>
                <div className="form-group">
                  <label className="form-label">소속</label>
                  <input className="form-input" value={editForm.dept} onChange={e => setF('dept', e.target.value)} placeholder="예: 한화파워"/>
                </div>
                <div className="form-group">
                  <label className="form-label">소유주</label>
                  <input className="form-input" value={editForm.owner} onChange={e => setF('owner', e.target.value)} placeholder="이름"/>
                </div>
                <div className="form-group">
                  <label className="form-label">전화번호 <span className="req">*</span></label>
                  <input className="form-input" type="tel" value={editForm.phone} onChange={e => setF('phone', e.target.value)} placeholder="010-0000-0000"/>
                </div>
                <div className="form-group">
                  <label className="form-label">당사 관련</label>
                  <select className="form-input" value={editForm.related} onChange={e => setF('related', e.target.value)}>
                    <option value="YES">YES - 당사 관련 차량</option>
                    <option value="NO">NO - 외부 차량</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">고객 차량</label>
                  <select className="form-input" value={editForm.customer||'NO'} onChange={e => setF('customer', e.target.value)}>
                    <option value="YES">YES - 고객 차량</option>
                    <option value="NO">NO - 일반</option>
                  </select>
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-primary" onClick={saveEdit}>✓ 수정완료</button>
              <button className="btn btn-secondary" onClick={closeEdit}>취소</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── APP ROOT ──
function App() {
  const [screen, setScreen]   = useState('main');
  const [vehicles, setVehicles] = useState(loadVehicles);
  const [log, setLog]           = useState(loadLog);
  const [stickers, setStickers] = useState(loadStickers);
  const [msg, setMsg]           = useState(loadMsg);
  const [synced, setSynced]     = useState(false); // Firestore 최초 수신 여부

  const go   = (s) => setScreen(s);
  const back = () => setScreen('main');

  const [syncStatus, setSyncStatus] = useState('connecting'); // connecting | ok | error
  const [syncMsg, setSyncMsg]       = useState('');

  // ── Firestore 실시간 구독 ──
  useEffect(() => {
    // Firebase 초기화 실패 시 로컬 데이터로 바로 시작
    if (!db || fbError) {
      console.warn('[Firebase] db 없음, 로컬 모드로 전환:', fbError);
      setSyncStatus('error');
      setSyncMsg('Firebase 연결 실패 (로컬 모드)');
      setSynced(true);
      return;
    }

    // 5초 타임아웃: 그래도 응답 없으면 로컬 데이터로 시작
    const timeout = setTimeout(() => {
      setSynced(true);
      setSyncStatus('error');
      setSyncMsg('Firebase 응답 없음 (로컬 모드)');
      console.warn('[Firebase] 5초 타임아웃');
    }, 5000);

    let vehiclesReady = false;

    // 차량 데이터 구독
    const unsubVehicles = db.collection('data').doc('vehicles')
      .onSnapshot(snap => {
        clearTimeout(timeout);
        if (snap.exists) {
          const data = snap.data().list || [];
          setVehicles(data);
          localStorage.setItem('hwp_vehicles_v1', JSON.stringify(data));
        }
        vehiclesReady = true;
        setSynced(true);
        setSyncStatus('ok');
        console.log('[Firebase] vehicles 수신 완료');
      }, err => {
        clearTimeout(timeout);
        console.error('[Firebase] vehicles 오류:', err.code, err.message);
        setSynced(true);
        setSyncStatus('error');
        setSyncMsg(`오류: ${err.code}`);
      });

    // 일일 현황 구독
    const unsubLog = db.collection('data').doc('log')
      .onSnapshot(snap => {
        if (snap.exists) {
          const data = snap.data().list || [];
          setLog(data);
          localStorage.setItem('hwp_log_v1', JSON.stringify(data));
        }
        console.log('[Firebase] log 수신 완료');
      }, err => {
        console.error('[Firebase] log 오류:', err.code, err.message);
      });

    // 스티커 구독
    const unsubStickers = db.collection('data').doc('stickers')
      .onSnapshot(snap => {
        if (snap.exists) {
          const data = snap.data().map || {};
          setStickers(data);
          localStorage.setItem('hwp_stickers_v1', JSON.stringify(data));
        }
      }, err => { console.error('[Firebase] stickers 오류:', err.code); });

    return () => { clearTimeout(timeout); unsubVehicles(); unsubLog(); unsubStickers(); };
  }, []);

  function handleRestore(v, l) {
    setVehicles(v); saveVehicles(v);
    setLog(l); saveLog(l);
  }
  function handleRestoreStickers(s) {
    setStickers(s); saveStickers(s);
  }

  // ── 동기화 전 로딩 화면 ──
  if (!synced) return (
    <div style={{
      minHeight:'100vh', display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center', gap:16,
      background:'var(--bg)', color:'var(--text)', padding:24
    }}>
      <div style={{
        width:48, height:48, border:'4px solid var(--primary)',
        borderTopColor:'transparent', borderRadius:'50%',
        animation:'spin 0.8s linear infinite'
      }}/>
      <div style={{fontSize:14, fontWeight:700}}>데이터 동기화 중...</div>
      <div style={{fontSize:12, color:'var(--text2)', textAlign:'center'}}>
        Firebase에서 데이터를 불러오고 있습니다<br/>
        <span style={{fontSize:10, color:'var(--border)', marginTop:4, display:'block'}}>
          5초 이상 걸리면 자동으로 로컬 모드로 전환됩니다
        </span>
      </div>
    </div>
  );

  if (screen === 'main') return <MainScreen onNav={go} vehicles={vehicles} log={log} onRestore={handleRestore} syncStatus={syncStatus} syncMsg={syncMsg} msg={msg} setMsg={setMsg}/>;
  if (screen === 'camera') return <CameraScreen onBack={back} vehicles={vehicles} setVehicles={setVehicles} log={log} setLog={setLog}/>;
  if (screen === 'excel') return <ExcelScreen onBack={back} vehicles={vehicles} setVehicles={setVehicles}/>;
  if (screen === 'direct') return <DirectScreen onBack={back} vehicles={vehicles} setVehicles={setVehicles}/>;
  if (screen === 'today') return <TodayScreen onBack={back} log={log} setLog={setLog} vehicles={vehicles} stickers={stickers} setStickers={setStickers}/>;
  if (screen === 'allvehicles') return <AllVehiclesScreen onBack={back} vehicles={vehicles} setVehicles={setVehicles} log={log} stickers={stickers}/>;
  if (screen === 'blacklist')   return <BlackListScreen   onBack={back} vehicles={vehicles} log={log} stickers={stickers}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
